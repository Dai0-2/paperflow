name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit:release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: paperflow-ai-extension
          path: |
            paperflow-ai.zip
            paperflow-ai.zip.sha256
          if-no-files-found: error

  release-extension:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PAPERFLOW_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PAPERFLOW_GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: test -n "$PAPERFLOW_GOOGLE_OAUTH_CLIENT_ID"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:ocr
      - run: pnpm typecheck
      - run: pnpm exec vite build --mode release
      - run: pnpm audit:release
      - run: cd dist && zip -qr ../paperflow-ai-${GITHUB_REF_NAME}.zip .
      - run: node scripts/write-sha256.mjs "paperflow-ai-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: paperflow-ai-${{ github.ref_name }}
          path: |
            paperflow-ai-${{ github.ref_name }}.zip
            paperflow-ai-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

  native-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: paperflow-native-host-macos
            platform: macos
          - os: windows-latest
            artifact: paperflow-native-host-windows
            platform: windows
          - os: ubuntu-latest
            artifact: paperflow-native-host-linux
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - if: matrix.platform == 'macos'
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/paperflow-home"
          mkdir -p "$test_home"
          HOME="$test_home" bash install/install-macos.sh "$PWD/target/release/paperflow-host"
          test -x "$test_home/Library/Application Support/PaperFlow AI/paperflow-host"
          HOME="$test_home" bash install/uninstall-macos.sh
          test ! -e "$test_home/Library/Application Support/PaperFlow AI/paperflow-host"
      - if: matrix.platform == 'linux'
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/paperflow-home"
          mkdir -p "$test_home"
          HOME="$test_home" XDG_DATA_HOME="$test_home/data" XDG_CONFIG_HOME="$test_home/config" \
            sh install/install-linux.sh "$PWD/target/release/paperflow-host"
          test -x "$test_home/data/paperflow-ai/paperflow-host"
          HOME="$test_home" XDG_DATA_HOME="$test_home/data" XDG_CONFIG_HOME="$test_home/config" \
            sh install/uninstall-linux.sh
          test ! -e "$test_home/data/paperflow-ai/paperflow-host"
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "PaperFlowHome"
          ./install/install-windows.ps1 -BinaryPath "$PWD/target/release/paperflow-host.exe"
          if (-not (Test-Path "$env:LOCALAPPDATA/PaperFlow AI/paperflow-host.exe")) { throw "Install failed" }
          ./install/uninstall-windows.ps1
          if (Test-Path "$env:LOCALAPPDATA/PaperFlow AI/paperflow-host.exe") { throw "Uninstall failed" }
      - if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p package
          cp target/release/paperflow-host package/
          cp "install/install-${{ matrix.platform }}.sh" package/
          cp "install/uninstall-${{ matrix.platform }}.sh" package/
          cp "manifests/com.paperflow.ai.${{ matrix.platform }}.json" package/
          cd package
          shasum -a 256 paperflow-host install-* uninstall-* com.paperflow.ai.*.json > SHA256SUMS
          zip -qr "../paperflow-native-host-${{ matrix.platform }}.zip" .
          cd ..
          shasum -a 256 "paperflow-native-host-${{ matrix.platform }}.zip" \
            > "paperflow-native-host-${{ matrix.platform }}.zip.sha256"
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item target/release/paperflow-host.exe package/
          Copy-Item install/INSTALL-PAPERFLOW.cmd package/
          Copy-Item install/install-windows.ps1 package/
          Copy-Item install/uninstall-windows.ps1 package/
          Copy-Item manifests/com.paperflow.ai.windows.json package/
          $files = @(
            "paperflow-host.exe",
            "INSTALL-PAPERFLOW.cmd",
            "install-windows.ps1",
            "uninstall-windows.ps1",
            "com.paperflow.ai.windows.json"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash "package/$file" -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          $lines | Set-Content package/SHA256SUMS -Encoding ascii
          Compress-Archive -Path package/* -DestinationPath paperflow-native-host-windows.zip -Force
          $zipHash = (Get-FileHash paperflow-native-host-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  paperflow-native-host-windows.zip" |
            Set-Content paperflow-native-host-windows.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            native-host/paperflow-native-host-${{ matrix.platform }}.zip
            native-host/paperflow-native-host-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error

  release-native-host:
    needs: native-host
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paperflow-native-host-*
          path: release
          merge-multiple: true
      - name: Publish Native Host release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "PaperFlow Native Host $GITHUB_REF_NAME" \
            --notes "Precompiled PaperFlow Native Host packages for Windows, macOS, and Linux. These packages are currently unsigned. Download only the archive for your operating system."
